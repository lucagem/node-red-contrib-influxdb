<script type="text/html" data-template-name="influxdb">
    <div class="form-row">
		<ul style="background: #fff; min-width: 600px; margin-bottom: 20px;" id="node-config-influxdb-tabs"></ul>
	</div>
    <!-- LucaT (START) -->
	<div id="node-config-influxdb-tabs-content" style="min-height: 170px;">
		<!-- LucaT: Original section in page "Configuration" (END) -->
        <div id="influxdb-tab-connection" style="display:none">            
            <div class="form-row" style="min-width: 500px;">
                <label for="node-config-input-name"><i class="fa fa-tag"></i> <span data-i18n="node-red:common.label.name"></span></label>
                <input type="text" id="node-config-input-name" data-i18n="[placeholder]node-red:common.label.name">
            </div>
            <div class="form-row">
                <label for="node-config-input-influxdbVersion"><i class="fa fa-code-fork"></i> <span data-i18n="influxdb.label.version"></span></label>
                <select type="text" style="width: 100px" id="node-config-input-influxdbVersion">
                    <option value="1.x">1.x</option> 
                    <option value="1.8-flux">1.8-flux</option> 
                    <option value="2.0">2.0</option> 
                </select>
            </div>
			<div class="form-row" id="node-config-row-hostname-port">
				<label for="node-config-input-hostname"><i class="fa fa-server"></i> <span data-i18n="influxdb.label.host"></span></label>
				<input class="input-append-left" type="text" id="node-config-input-hostname" placeholder="localhost" style="width: 40%;" >
				<label for="node-config-input-port" style="margin-left: 10px; width: 35px; "> <span data-i18n="influxdb.label.port"></span></label>
				<input type="text" id="node-config-input-port" style="width:45px">
			</div>
			<div class="form-row" id="node-config-row-url">
				<label for="node-config-input-url"><i class="fa fa-server"></i> <span data-i18n="influxdb.label.url"></span></label>
				<input class="input-append-left" type="text" id="node-config-input-url" placeholder="http://localhost:8086">
			</div>
			<div class="form-row" id="node-config-row-database">
				<label for="node-config-input-database"><i class="fa fa-database"></i> <span data-i18n="influxdb.label.database"></span></label>
				<input type="text" id="node-config-input-database">
			</div>
			<div class="form-row" id="node-config-row-username">
				<label for="node-config-input-username"><i class="fa fa-user"></i> <span data-i18n="node-red:common.label.username"></span></label>
				<input type="text" id="node-config-input-username">
			</div>
			<div class="form-row" id="node-config-row-password">
				<label for="node-config-input-password"><i class="fa fa-lock"></i> <span data-i18n="node-red:common.label.password"></span></label>
				<input type="password" id="node-config-input-password">
			</div>
			<div class="form-row" id="node-config-row-token">

				<input type="password" id="node-config-input-token">

			<div class="form-row" id="node-config-row-timeout">

			</div>
			<div class="form-row" id="node-config-row-rejectUnauthorized">

			</div>
			<div class="form-row" id="node-config-row-enableSecureConnection">

			</div>
            
		</div>
        <!-- LucaT: Original section in page "Configuration" (END) -->

        <!-- LucaT: New section in page "Dynamic Properties" (START) -->
        <div id="influxdb-tab-dynamic" style="display:none">
            <!-- Connection Control -->
            <div class="form-row">
                <label for="node-config-input-dynamicEnabled"><i class="fa fa-power-off"></i> Connection Enabled</label>

                <code style="background-color: #f8f9fa; padding: 2px 4px; border-radius: 3px; font-family: monospace;">'0'</code> to disable the connection completely. 
                When disabled, all InfluxDb operations will be silently ignored without generating errors.

            </div>            
            <!-- General Version Control -->

            </div>        
            <!-- InfluxDb 1.0 Section -->

            <h4 style="margin: 10px 0; color: #666; font-weight: bold; font-size: 16px;">InfluxDb 1.0 Configuration</h4>

                <label for="node-config-input-dynamicPort10"><i class="fa fa-plug"></i> Port (1.0)</label>

            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Port</strong> for InfluxDb 1.0 version. Default is <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">8086</code>. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_PORT_10}</code> for environment variable.
            </div>            
            <div class="form-row">
                <label for="node-config-input-dynamicDatabase10"><i class="fa fa-database"></i> Database (1.0)</label>
                <input type="text" id="node-config-input-dynamicDatabase10" placeholder="db0 | ${IDB_DATABASE_10}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Database name</strong> for InfluxDb 1.0. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_DATABASE_10}</code> for environment variable.
            </div>            
            <div class="form-row">
                <label for="node-config-input-dynamicUsername10"><i class="fa fa-user"></i> Username (1.0)</label>
                <input type="text" id="node-config-input-dynamicUsername10" placeholder="admin | ${IDB_USERNAME_10}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Username</strong> for InfluxDb 1.0 authentication. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_USERNAME_10}</code> for environment variable.
            </div>            
            <div class="form-row">
                <label for="node-config-input-dynamicPassword10"><i class="fa fa-lock"></i> Password (1.0)</label>
                <input type="text" id="node-config-input-dynamicPassword10" placeholder="${IDB_PASSWORD_10}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Password</strong> for InfluxDb 1.0 authentication. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_PASSWORD_10}</code> for environment variable.
            </div>                       
            <!-- InfluxDb 1.8 Section -->
            <hr style="margin: 30px 0; border: none; border-top: 2px solid #ddd;">
            <h4 style="margin: 10px 0; color: #666; font-weight: bold; font-size: 16px;">InfluxDb 1.8 Configuration</h4>            
            <div class="form-row">
                <label for="node-config-input-dynamicUrl18Flux"><i class="fa fa-server"></i> URL (1.8)</label>
                <input type="text" id="node-config-input-dynamicUrl18Flux" placeholder="localhost | ${IDB_URL_18_FLUX}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Full URL</strong> for InfluxDb 1.8 version. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_URL_18_FLUX}</code> for environment variable.
            </div>            
            <div class="form-row">
                <label for="node-config-input-dynamicUsername18"><i class="fa fa-user"></i> Username (1.8)</label>
                <input type="text" id="node-config-input-dynamicUsername18" placeholder="admin | ${IDB_USERNAME_18_FLUX}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Username</strong> for InfluxDb 1.8 authentication. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_USERNAME_18_FLUX}</code> for environment variable.
            </div>            
            <div class="form-row">
                <label for="node-config-input-dynamicPassword18"><i class="fa fa-lock"></i> Password (1.8)</label>
                <input type="text" id="node-config-input-dynamicPassword18" placeholder="${IDB_PASSWORD_18_FLUX}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Password</strong> for InfluxDb 1.8 authentication. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_PASSWORD_18_FLUX}</code> for environment variable.
            </div>            
            <!-- InfluxDb 2.0 Section -->
            <hr style="margin: 30px 0; border: none; border-top: 2px solid #ddd;">
            <h4 style="margin: 10px 0; color: #666; font-weight: bold; font-size: 16px;">InfluxDb 2.0 Configuration</h4>            
            <div class="form-row">
                <label for="node-config-input-dynamicUrl20"><i class="fa fa-server"></i> URL (2.0)</label>
                <input type="text" id="node-config-input-dynamicUrl20" placeholder="http://localhost:8086 | ${IDB_URL_20}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Full URL</strong> for InfluxDb 2.0 server. Include protocol and port. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_URL_20}</code> for environment variable.
            </div>            
            <div class="form-row">
                <label for="node-config-input-dynamicToken20"><i class="fa fa-key"></i> Token (2.0)</label>
                <input type="text" id="node-config-input-dynamicToken20" placeholder="${IDB_TOKEN}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Authentication token</strong> for InfluxDb 2.0. Required for authentication instead of username/password. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_TOKEN}</code> for environment variable.
            </div>                 
            <div class="form-row">
                <label for="node-config-input-dynamicTimeout20"><i class="fa fa-clock-o"></i> Timeout (seconds)</label>
                <input type="text" id="node-config-input-dynamicTimeout20" placeholder="10 | ${IDB_TIMEOUT_20}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Connection timeout</strong> in seconds. Default is <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">10</code>. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_TIMEOUT_20}</code> for environment variable.
            </div>            
            <div class="form-row">
                <label for="node-config-input-dynamicVerifyCertificate20"><i class="fa fa-shield"></i> Reject Unauthorized</label>
                <input type="text" id="node-config-input-dynamicVerifyCertificate20" placeholder="true | false | ${IDB_VERIFY_CERTIFICATE_20}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Verify server certificate</strong> when connecting via HTTPS. Set to <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">true</code> or <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">false</code>. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_VERIFY_CERTIFICATE_20}</code> for environment variable.
			</div>            
        </div>         
        <!-- LucaT: New section in page "Dynamic Properties" (END) -->
	</div>
    <!-- LucaT (END) -->
</script>

<script type="text/javascript">
    function getVersion() {
        return $("#node-config-input-influxdbVersion option:selected").val();
    }
    RED.nodes.registerType('influxdb', {
        category: 'config',
        color: "rgb(218, 196, 180)",
        defaults: {
            hostname: { value: "127.0.0.1", required: true },
            port: { value: 8086, required: true },
            protocol: { value: "http", required: true },
            database: {
                value: "database",
                validate: function (db) {
                    let version = getVersion();
                    if (!version || version === '1.x') {
                        return db.length > 0;
                    }
                    return true;
                }
            },
            name: { value: "" },
            usetls: { value: false },
            tls: { type: "tls-config", required: false },
            influxdbVersion: { value: "1.x", required: false },
            url: {
                value: "http://localhost:8086",
                validate: function (url) {
                    let version = getVersion();
                    if (version === '1.8-flux' || version === '2.0') {
                        return url.length > 0;
                    }
                    return true;
                }
            },
            timeout: { value: 10, required: false },
            rejectUnauthorized: { value: true },
            // LucaT: Dynamic Properties validation
            dynamicEnabled: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Check if it's a valid boolean-like value
                    return ["true", "false", "0", "1"].includes(value.toLowerCase());
                }
            },
            dynamicVersion: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Check if it's a valid version
                    return ["1", "1.8", "2"].includes(value);
                }
            },
            dynamicUsername18: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For username, accept any non-empty string
                    return value.length > 0 && !value.startsWith("$") && !value.includes("}") && !value.includes("{");
                }
            },
            dynamicPassword18: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For password, accept any string (can be empty)
                    return true;
                }
            },
            dynamicUrl18Flux: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Basic URL validation - should start with http:// or https://
                    return value.startsWith("http://") || value.startsWith("https://");
                }
            },
            dynamicUrl20: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Basic URL validation - should start with http:// or https://
                    return value.startsWith("http://") || value.startsWith("https://");
                }
            },
            dynamicToken20: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For token, accept any non-empty string
                    return value.length > 0;
                }
            },
            dynamicHostname10: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For hostname, accept any non-empty string that's not just whitespace
                    return value.length > 0 && !value.startsWith("$") && !value.includes("}") && !value.includes("{");
                }
            },
            dynamicPort10: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Check if it's a valid port number
                    const port = parseInt(value);
                    return !isNaN(port) && port > 0 && port <= 65535;
                }
            },
            dynamicDatabase10: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For database name, accept any non-empty string
                    return value.length > 0 && !value.startsWith("$") && !value.includes("}") && !value.includes("{");
                }
            },
            dynamicUsername10: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For username, accept any non-empty string
                    return value.length > 0 && !value.startsWith("$") && !value.includes("}") && !value.includes("{");
                }
            },
            dynamicPassword10: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For password, accept any string (can be empty)
                    return true;
                }
            },
            dynamicTimeout20: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Check if it's a valid positive number
                    const timeout = parseInt(value);
                    return !isNaN(timeout) && timeout > 0;
                }
            },
            dynamicVerifyCertificate20: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Check if it's a valid boolean-like value
                    return ["true", "false", "0", "1"].includes(value.toLowerCase());
                }
            },
        },
        credentials: {
            username: { type: "text" },
            password: { type: "password" },
            token: { type: "password" }
        },
        label: function () {
            this.influxdbVersion = this.influxdbVersion || '1.x';   // for compatibility
            var version = "[v" + this.influxdbVersion + "] ";
            if (this.influxdbVersion === '1.8-flux' || this.influxdbVersion === '2.0') {
                return this.name ? version + this.name : version + this.url;
            } else {
                return this.name ? version + this.name : version + this.hostname + ":" + this.port + "/" + this.database;
            }
        },
        oneditprepare: function () {
            // ------------ LucaT START
            var self = this;

            // Prepara i tab
            var tabs = RED.tabs.create({
                id: "node-config-influxdb-tabs",
                onchange: function (tab) {
                    $("#node-config-influxdb-tabs-content").children().hide();
                    $("#" + tab.id).show();
                }
            });
            tabs.addTab({
                id: "influxdb-tab-connection",
                label: "Configuration"
            });
            tabs.addTab({
                id: "influxdb-tab-dynamic",
                label: "Dynamic Properties"
            });
            setTimeout(function () {
                tabs.resize()
            }, 0);
            // ------------ LucaT END

            // ------------ LucaT: Initialize Dynamic Properties values (START)
            // Popola i campi con i valori salvati
            $("#node-config-input-dynamicEnabled").val(this.dynamicEnabled || "");
            $("#node-config-input-dynamicVersion").val(this.dynamicVersion || "");
            // Sezione 1.0
            $("#node-config-input-dynamicHostname10").val(this.dynamicHostname10 || "");
            $("#node-config-input-dynamicPort10").val(this.dynamicPort10 || "");
            $("#node-config-input-dynamicDatabase10").val(this.dynamicDatabase10 || "");
            $("#node-config-input-dynamicUsername10").val(this.dynamicUsername10 || "");
            $("#node-config-input-dynamicPassword10").val(this.dynamicPassword10 || "");
            // Sezione 1.8
            $("#node-config-input-dynamicUrl18Flux").val(this.dynamicUrl18Flux || "");
            $("#node-config-input-dynamicUsername18").val(this.dynamicUsername18 || "");
            $("#node-config-input-dynamicPassword18").val(this.dynamicPassword18 || "");
            // Sezione 2.0
            $("#node-config-input-dynamicUrl20").val(this.dynamicUrl20 || "");
            $("#node-config-input-dynamicToken20").val(this.dynamicToken20 || "");
            $("#node-config-input-dynamicTimeout20").val(this.dynamicTimeout20 || "");
            $("#node-config-input-dynamicVerifyCertificate20").val(this.dynamicVerifyCertificate20 || "");        

            // ------------ LucaT: Initialize Dynamic Properties values (END)

            function updateTLSOptions() {
                if ($("#node-config-input-usetls").is(':checked')) {
                    $("#node-config-row-tls").show();
                } else {
                    $("#node-config-row-tls").hide();
                }
            }

            function update18Options() {
                $("#node-config-row-hostname-port").show();
                $("#node-config-row-url").hide();
                $("#node-config-row-database").show();
                $("#node-config-row-username").show();
                $("#node-config-row-password").show();
                $("#node-config-row-token").hide();
                $("#node-config-row-timeout").hide();
                $("#node-config-row-rejectUnauthorized").hide();
                $("#node-config-row-enableSecureConnection").show();
            }

            function update18FluxOptions() {
                $("#node-config-row-hostname-port").hide();
                $("#node-config-row-url").show();
                $("#node-config-row-database").hide();
                $("#node-config-row-username").show();
                $("#node-config-row-password").show();
                $("#node-config-row-token").hide();
                $("#node-config-row-timeout").show();
                $("#node-config-row-rejectUnauthorized").show();
                $("#node-config-row-enableSecureConnection").hide();
            }

            function update20Options() {
                $("#node-config-row-hostname-port").hide();
                $("#node-config-row-url").show();
                $("#node-config-row-database").hide();
                $("#node-config-row-username").hide();
                $("#node-config-row-password").hide();
                $("#node-config-row-token").show();
                $("#node-config-row-timeout").show();
                $("#node-config-row-rejectUnauthorized").show();
                $("#node-config-row-enableSecureConnection").hide();
            }

            $("#node-config-input-influxdbVersion").change(function () {
                let selected = $("#node-config-input-influxdbVersion option:selected").val();

                switch (selected) {
                    case '1.8-flux':
                        update18FluxOptions();
                        break;
                    case '2.0':
                        update20Options();
                        break;
                    default:    // 1.x
                        update18Options();
                        updateTLSOptions();
                        $("#node-config-input-usetls").on("click", function () {
                            updateTLSOptions();
                        });
                }
            });
            // if version not set assume 1.x to support older flows
            let selected = $("#node-config-input-influxdbVersion option:selected").val();
            selected = selected || '1.x';
            $("#node-config-input-influxdbVersion").val(selected)
        }
    });
</script>
