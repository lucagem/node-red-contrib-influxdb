<script type="text/html" data-template-name="influxdb">
    <div class="form-row">
		<ul style="background: #fff; min-width: 600px; margin-bottom: 20px;" id="node-config-influxdb-tabs"></ul>
	</div>
    <!-- LucaT (START) -->
	<div id="node-config-influxdb-tabs-content" style="min-height: 170px;">
		<!-- LucaT: Original section in page "Configuration" (END) -->
        <div id="influxdb-tab-connection" style="display:none">            
            <div class="form-row" style="min-width: 500px;">

                <strong>Username</strong> for InfluxDb 1.8 authentication. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_USERNAME_18_FLUX}</code> for environment variable.
            </div>            
            <div class="form-row">

            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Password</strong> for InfluxDb 1.8 authentication. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_PASSWORD_18_FLUX}</code> for environment variable.
            </div>            
            <!-- InfluxDb 2.0 Section -->
            <hr style="margin: 30px 0; border: none; border-top: 2px solid #ddd;">
            <h4 style="margin: 10px 0; color: #666; font-weight: bold; font-size: 16px;">InfluxDb 2.0 Configuration</h4>            
            <div class="form-row">
                <label for="node-config-input-dynamicUrl2x"><i class="fa fa-server"></i> URL (2.0)</label>
                <input type="text" id="node-config-input-dynamicUrl2x" placeholder="http://localhost:8086 | ${IDB_URL_2X}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Full URL</strong> for InfluxDb 2.0 server. Include protocol and port. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_URL_2X}</code> for environment variable.
            </div>            
            <div class="form-row">
                <label for="node-config-input-dynamicToken2x"><i class="fa fa-key"></i> Token (2.0)</label>
                <input type="text" id="node-config-input-dynamicToken2x" placeholder="${IDB_TOKEN}">
            </div>
            <div class="form-tips" style="margin-bottom: 15px; padding: 8px 12px; background-color: #fff3cd; border-left: 4px solid #ffc107; border-radius: 4px; line-height: 1.4; min-height: auto; max-width: none; width: auto;">
                <strong>Authentication token</strong> for InfluxDb 2.0. Required for authentication instead of username/password. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_TOKEN}</code> for environment variable.

            <div class="form-row">
                <label for="node-config-input-dynamicTimeout2x"><i class="fa fa-clock-o"></i> Timeout (seconds)</label>

                <strong>Connection timeout</strong> in seconds. Default is <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">10</code>. Use <code style="background-color: #f8f9fa; padding: 1px 3px; border-radius: 2px; font-family: monospace;">${IDB_TIMEOUT_2X}</code> for environment variable.

<!-- #region Javascript Nodo CONFIG -->
<script type="text/javascript">
    function getVersion() {
        return $("#node-config-input-influxdbVersion option:selected").val();
    }
    RED.nodes.registerType('influxdb', {
        category: 'config',
        color: "rgb(218, 196, 180)",
        defaults: {
            hostname: { value: "127.0.0.1", required: true },
            port: { value: 8086, required: true },
            protocol: { value: "http", required: true },
            database: {
                value: "database",
                validate: function (db) {
                    let version = getVersion();
                    if (!version || version === '1.x') {
                        return db.length > 0;
                    }
                    return true;
                }
            },
            name: { value: "" },
            usetls: { value: false },
            tls: { type: "tls-config", required: false },
            influxdbVersion: { value: "1.x", required: false },
            url: {
                value: "http://localhost:8086",
                validate: function (url) {
                    let version = getVersion();
                    if (version === '1.8-flux' || version === '2.0') {
                        return url.length > 0;
                    }
                    return true;
                }
            },
            timeout: { value: 10, required: false },
            rejectUnauthorized: { value: true },
            // LucaT: Dynamic Properties validation
            dynamicEnabled: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Check if it's a valid boolean-like value
                    return ["true", "false", "0", "1"].includes(value.toLowerCase());
                }
            },
            dynamicVersion: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Check if it's a valid version
                    return ["1", "1.8", "2"].includes(value);
                }
            },
            dynamicUsername18Flux: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For username, accept any non-empty string
                    return value.length > 0 && !value.startsWith("$") && !value.includes("}") && !value.includes("{");
                }
            },
            dynamicPassword18Flux: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For password, accept any string (can be empty)
                    return true;
                }
            },
            dynamicUrl18Flux: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Basic URL validation - should start with http:// or https://
                    return value.startsWith("http://") || value.startsWith("https://");
                }
            },
            dynamicUrl2x: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Basic URL validation - should start with http:// or https://
                    return value.startsWith("http://") || value.startsWith("https://");
                }
            },
            dynamicToken2x: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For token, accept any non-empty string
                    return value.length > 0;
                }
            },
            dynamicHostname1x: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For hostname, accept any non-empty string that's not just whitespace
                    return value.length > 0 && !value.startsWith("$") && !value.includes("}") && !value.includes("{");
                }
            },
            dynamicPort1x: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Check if it's a valid port number
                    const port = parseInt(value);
                    return !isNaN(port) && port > 0 && port <= 65535;
                }
            },
            dynamicDatabase1x: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For database name, accept any non-empty string
                    return value.length > 0 && !value.startsWith("$") && !value.includes("}") && !value.includes("{");
                }
            },
            dynamicUsername1x: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For username, accept any non-empty string
                    return value.length > 0 && !value.startsWith("$") && !value.includes("}") && !value.includes("{");
                }
            },
            dynamicPassword1x: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // For password, accept any string (can be empty)
                    return true;
                }
            },
            dynamicTimeout2x: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Check if it's a valid positive number
                    const timeout = parseInt(value);
                    return !isNaN(timeout) && timeout > 0;
                }
            },
            dynamicVerifyCertificate2x: {
                value: "",
                validate: function (value) {
                    if (!value || value.trim() === "") return true; // Empty is valid
                    value = value.trim();
                    // Check if it's an environment variable
                    if (value.startsWith("${") && value.endsWith("}")) return true;
                    // Check if it's a valid boolean-like value
                    return ["true", "false", "0", "1"].includes(value.toLowerCase());
                }
            },
        },
        credentials: {
            username: { type: "text" },
            password: { type: "password" },
            token: { type: "password" }
        },
        label: function () {
            this.influxdbVersion = this.influxdbVersion || '1.x';   // for compatibility
            var version = "[v" + this.influxdbVersion + "] ";
            if (this.influxdbVersion === '1.8-flux' || this.influxdbVersion === '2.0') {
                return this.name ? version + this.name : version + this.url;
            } else {
                return this.name ? version + this.name : version + this.hostname + ":" + this.port + "/" + this.database;
            }
        },
        oneditprepare: function () {
            // ------------ LucaT START
            var self = this;

            // Prepara i tab

            $("#node-config-input-dynamicPort1x").val(this.dynamicPort1x || "");
            $("#node-config-input-dynamicDatabase1x").val(this.dynamicDatabase1x || "");
            $("#node-config-input-dynamicUsername1x").val(this.dynamicUsername1x || "");
            $("#node-config-input-dynamicPassword1x").val(this.dynamicPassword1x || "");
            // Sezione 1.8
            $("#node-config-input-dynamicUrl18Flux").val(this.dynamicUrl18Flux || "");
            $("#node-config-input-dynamicUsername18Flux").val(this.dynamicUsername18Flux || "");
            $("#node-config-input-dynamicPassword18Flux").val(this.dynamicPassword18Flux || "");
            // Sezione 2.0
            $("#node-config-input-dynamicUrl2x").val(this.dynamicUrl2x || "");
            $("#node-config-input-dynamicToken2x").val(this.dynamicToken2x || "");
            $("#node-config-input-dynamicTimeout2x").val(this.dynamicTimeout2x || "");
            $("#node-config-input-dynamicVerifyCertificate2x").val(this.dynamicVerifyCertificate2x || "");

            // ------------ LucaT: Initialize Dynamic Properties values (END)

            function updateTLSOptions() {
                if ($("#node-config-input-usetls").is(':checked')) {
                    $("#node-config-row-tls").show();
                } else {
                    $("#node-config-row-tls").hide();
                }
            }

            function update18Options() {
                $("#node-config-row-hostname-port").show();
                $("#node-config-row-url").hide();
                $("#node-config-row-database").show();
                $("#node-config-row-username").show();
                $("#node-config-row-password").show();
                $("#node-config-row-token").hide();
                $("#node-config-row-timeout").hide();
                $("#node-config-row-rejectUnauthorized").hide();
                $("#node-config-row-enableSecureConnection").show();
            }

            function update18FluxOptions() {
                $("#node-config-row-hostname-port").hide();
                $("#node-config-row-url").show();
                $("#node-config-row-database").hide();
                $("#node-config-row-username").show();
                $("#node-config-row-password").show();
                $("#node-config-row-token").hide();
                $("#node-config-row-timeout").show();
                $("#node-config-row-rejectUnauthorized").show();
                $("#node-config-row-enableSecureConnection").hide();
            }

            function update20Options() {
                $("#node-config-row-hostname-port").hide();
                $("#node-config-row-url").show();
                $("#node-config-row-database").hide();
                $("#node-config-row-username").hide();
                $("#node-config-row-password").hide();
                $("#node-config-row-token").show();
                $("#node-config-row-timeout").show();
                $("#node-config-row-rejectUnauthorized").show();
                $("#node-config-row-enableSecureConnection").hide();
            }

            $("#node-config-input-influxdbVersion").change(function () {
                let selected = $("#node-config-input-influxdbVersion option:selected").val();

                switch (selected) {
                    case '1.8-flux':
                        update18FluxOptions();
                        break;
                    case '2.0':
                        update20Options();
                        break;
                    default:    // 1.x
                        update18Options();
                        updateTLSOptions();

            // if version not set assume 1.x to support older flows
            let selected = $("#node-config-input-influxdbVersion option:selected").val();
            selected = selected || '1.x';
            $("#node-config-input-influxdbVersion").val(selected)
        }

<script type="text/html" data-help-name="influxdb out">
    <p>A simple influxdb output node to write values and tags to an influxdb measurement.</p>
    <p>The fields and tags to write are in <b>msg.payload</b>. If <b>msg.payload</b> is a string, number, or boolean, 
    it will be written as a single value to the specified measurement (called <i>value</i>).</p>
    <p>If <b>msg.payload</b> is an object containing multiple properties, the fields will be written to the measurement.</p>
    <p>If <b>msg.payload</b> is an array containing two objects, the first object will be written as the set of named fields, 
    the second is the set of named tags.</p>
    <p>Finally, if <b>msg.payload</b> is an array of arrays, it will be written as a series of points containing fields and tags.</p>
    <p>If the <i>measurement</i> field is not set in the node configuration, the user can send in data with a specified measurement 
        name in <b>msg.measurement</b> to overwrite the <i>measurement</i> field in the configuration of the node.</p>

    <p><b>InfluxDB 1.x Mode</b></p>
    <p>Check <i>Advanced Query Options</i> to specify a time precision and retention policy for the insertion.<p>
    <p>The advanced query options <i>Time Precision</i> and <i>Retention Policy</i> can be overwritten using 
    message properties <b>msg.precision</b> and <b>msg.retentionPolicy</b>.</p>

    <p><b>InfluxDB 1.8 Flux and InfluxDB 2.0 Mode</b></p>
    <p>If no retention policy is specified, <i>autogen</i> will be assumed.</p>
</script>

<script type="text/javascript">
    function selectedVersion() {
        // use prefix to update UI when version of config node changes
        var optionSelected = $("#node-input-influxdb option:selected").text();
        var influxDBVersionMatches = optionSelected.match(/\[(.*?)\]/);
        var influxDBVersion = '';
        if (influxDBVersionMatches) {
            influxDBVersion = influxDBVersionMatches[1];
        }
        return influxDBVersion;
    }

    RED.nodes.registerType('influxdb out', {
        category: 'storage-output',
        color: "rgb(218, 196, 180)",
        defaults: {
            influxdb: { type: "influxdb", required: true },
            name: { value: "" },
            measurement: { value: "" },
            precision: { value: "" },
            retentionPolicy: { value: "" },
            // LucaT: Dynamic Properties per nodo OUT
            dynamicEnabled: { value: "" },
            dynamicVersion: { value: "" },
            dynamicMeasurement: { value: "" },
            dynamicDatabase: { value: "" },
            dynamicRetentionPolicyV18Flux: { value: "" },
            dynamicOrg: { value: "" },
            dynamicBucket: { value: "" },
            dynamicPrecision: { value: "" },
            database: {
                value: "database",
                validate: function (db) {
                    if (selectedVersion() === 'v1.8-flux') {
                        return db.length > 0;
                    }
                    return true;
                }
            },
            precisionV18FluxV20: { value: "ms" },
            retentionPolicyV18Flux: { value: "" },
            org: {
                value: "organisation",
                validate: function (org) {
                    if (selectedVersion() === 'v2.0') {
                        return org.length > 0;
                    }
                    return true;
                }
            },
            bucket: {
                value: "bucket",
                validate: function (bucket) {
                    let version = selectedVersion()
                    if (version === 'v2.0') {
                        return bucket.length > 0;
                    }
                    return true;
                }
            }
        },
        inputs: 1,
        outputs: 0,
        icon: "influxdb.png",
        align: "right",
        label: function () {
            var influxNode = RED.nodes.node(this.influxdb);
            return this.name || (influxNode ? influxNode.label() + " " + this.measurement : "influxdb");
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            // ------------ LucaT: Inizializzazione tab START
            var tabs = RED.tabs.create({
                id: "node-influxdb-out-tabs",
                onchange: function (tab) {
                    $("#node-influxdb-out-tabs-content").children().hide();
                    $("#" + tab.id).show();
                }
            });
            tabs.addTab({
                id: "influxdb-out-tab-connection",
                label: "Configuration"
            });
            tabs.addTab({
                id: "influxdb-out-tab-dynamic",
                label: "Dynamic Properties"
            });
            setTimeout(function () {
                tabs.resize()
            }, 0);

            // Popola i campi dinamici con i valori salvati
            $("#node-input-dynamicMeasurement").val(this.dynamicMeasurement || "");
            $("#node-input-dynamicDatabase").val(this.dynamicDatabase || "");
            $("#node-input-dynamicRetentionPolicyV18Flux").val(this.dynamicRetentionPolicyV18Flux || "");
            $("#node-input-dynamicOrg").val(this.dynamicOrg || "");
            $("#node-input-dynamicBucket").val(this.dynamicBucket || "");
            $("#node-input-dynamicPrecision").val(this.dynamicPrecision || "");
            // ------------ LucaT: Inizializzazione tab END            
            $("#advanced-options-checkbox").change(function () {
                if ($('#advanced-options-checkbox').is(":checked")) {
                    $("#advanced-options-div").show();
                } else {
                    $("#advanced-options-div").hide();
                }
            });

            // show advanced options if a query option is set on startup
            if (($('#node-input-precision').val() === "")
                && ($('#node-input-retentionPolicy').val() === "")) {
                $("#advanced-options-div").hide();
            } else {
                $('#advanced-options-checkbox').prop('checked', true);
                $("#advanced-options-div").show();
            }

            function update18Options() {
                $("#node-input-row-org").hide();
                $("#node-input-row-bucket").hide();
                $("#node-input-row-database").hide();
                $("#node-input-row-enableAdvancedOptions").show();
                $("#node-input-row-precisionV18FluxV20").hide();
                $("#node-input-row-retentionPolicyV18Flux").hide();
                $("#node-warning-retention-policy").show();
            }

            function update18FluxOptions() {
                $("#node-input-row-org").hide();
                $("#node-input-row-bucket").hide();
                $("#node-input-row-database").show();
                $("#node-input-row-enableAdvancedOptions").hide();
                $("#node-input-row-precisionV18FluxV20").show();
                $("#node-input-row-retentionPolicyV18Flux").show();
                $("#node-warning-retention-policy").show();
            }

            function update20Options() {
                $("#node-input-row-org").show();
                $("#node-input-row-bucket").show();
                $("#node-input-row-database").hide();
                $("#node-input-row-enableAdvancedOptions").hide();
                $("#node-input-row-precisionV18FluxV20").show();
                $("#node-input-row-retentionPolicyV18Flux").hide();
                $("#node-warning-retention-policy").hide();
            }

            $("#node-input-influxdb").change(function () {
                switch (selectedVersion()) {
                    case 'v1.8-flux':
                        update18FluxOptions();
                        break;
                    case 'v2.0':
                        update20Options();
                        break;
                    default:
                        update18Options();
                }
            });

            $("#node-input-measurement").change(function () {
                if ($("#node-input-measurement").val() === "") {
                    $("#node-warning-measurement").show();
                } else {
                    $("#node-warning-measurement").hide();
                }
            });
        },
        oneditsave: function () {
            // reset inputs if we are not using advanced options
            if (!$("#advanced-options-checkbox").is(':checked')) {
                $("#node-input-precision").val("");
                $("#node-input-retentionPolicy").val("");
                // ------------ LucaT: Save Dynamic Properties values (START)
                this.dynamicEnabled = $("#node-config-input-dynamicEnabled").val();
                this.dynamicVersion = $("#node-config-input-dynamicVersion").val();
                // Sezione 1.x
                this.dynamicHostname1x = $("#node-config-input-dynamicHostname1x").val();
                this.dynamicPort1x = $("#node-config-input-dynamicPort1x").val();
                this.dynamicDatabase1x = $("#node-config-input-dynamicDatabase1x").val();
                this.dynamicUsername1x = $("#node-config-input-dynamicUsername1x").val();
                this.dynamicPassword1x = $("#node-config-input-dynamicPassword1x").val();
                // Sezione 1.8
                this.dynamicUrl18Flux = $("#node-config-input-dynamicUrl18Flux").val();
                this.dynamicUsername18Flux = $("#node-config-input-dynamicUsername18Flux").val();
                this.dynamicPassword18Flux = $("#node-config-input-dynamicPassword18Flux").val();
                // Sezione 2.x
                this.dynamicUrl2x = $("#node-config-input-dynamicUrl2x").val();
                this.dynamicToken2x = $("#node-config-input-dynamicToken2x").val();
                this.dynamicTimeout2x = $("#node-config-input-dynamicTimeout2x").val();
                this.dynamicVerifyCertificate2x = $("#node-config-input-dynamicVerifyCertificate2x").val();
                // ------------ LucaT: Save Dynamic Properties values (END)
            }
        }

    <p>A influxdb output node to write multiple points (fields and tags) to multiple influxdb measurements.</p>
    <p>The <b>msg.payload</b> needs to be an array of <i>point</i> objects.</p>
    <p>The <b>measurement</b> property of a point contains the name of the measurement for the point. The <b>fields</b> property will contain the
    fields of the point.  If supplied, the <b>tags</b> property will contain the tags for the point. To set the time
    for the point, supply a <b>timestamp</b> property.</p>
    <p>Check <i>Advanced Query Options</i> to specify a time precision and retention policy for the insertion.<p>
    <p>The advanced query options <i>Time Precision</i> and <i>Retention Policy</i> can be overwritten using

<script type="text/javascript">

            },
            precisionV18FluxV20: { value: "ms" },

                value: "organisation",
                validate: function (org) {
                    if (selectedVersion() === 'v2.0') {
                        return org.length > 0;
                    }
                    return true;
                }
            },
            bucket: {
                value: "bucket",
                validate: function (bucket) {
                    let version = selectedVersion()
                    if (version === 'v2.0') {
                        return bucket.length > 0;
                    }
                    return true;
                }
            }
        },
        inputs: 1,
        outputs: 0,
        icon: "influxdb.png",
        align: "right",
        label: function () {
            var influxNode = RED.nodes.node(this.influxdb);

        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            function update18Options() {
                $("#node-input-row-org").hide();
                $("#node-input-row-bucket").hide();
                $("#node-input-row-database").hide();
                $("#node-input-row-enableAdvancedOptions").show();
                $("#node-input-row-precisionV18FluxV20").hide();
                $("#node-input-row-retentionPolicyV18Flux").hide();
                $("#node-warning-retention-policy").show();
            }

            function update18FluxOptions() {
                $("#node-input-row-org").hide();
                $("#node-input-row-bucket").hide();
                $("#node-input-row-database").show();
                $("#node-input-row-enableAdvancedOptions").hide();
                $("#node-input-row-precisionV18FluxV20").show();
                $("#node-input-row-retentionPolicyV18Flux").show();
                $("#node-warning-retention-policy").show();
            }

            function update20Options() {
                $("#node-input-row-org").show();
                $("#node-input-row-bucket").show();
                $("#node-input-row-database").hide();
                $("#node-input-row-enableAdvancedOptions").hide();
                $("#node-input-row-precisionV18FluxV20").show();
                $("#node-input-row-retentionPolicyV18Flux").hide();
                $("#node-warning-retention-policy").hide();
            }
            $("#node-input-influxdb").change(function () {
                switch (selectedVersion()) {
                    case 'v1.8-flux':
                        update18FluxOptions();
                        break;
                    case 'v2.0':
                        update20Options();
                        break;
                    default:
                        update18Options();
                }
            });

            $("#advanced-options-checkbox").change(function () {
                if ($('#advanced-options-checkbox').is(":checked")) {
                    $("#advanced-options-div").show();
                } else {
                    $("#advanced-options-div").hide();

            });

            if (($('#node-input-precision').val() === "")
                && ($('#node-input-retentionPolicy').val() === "")) {
                $("#advanced-options-div").hide();
            } else {
                $('#advanced-options-checkbox').prop('checked', true);
                $("#advanced-options-div").show();
            }
        },
        oneditsave: function () {
            // reset inputs if we are not using advanced options
            if (!$("#advanced-options-checkbox").is(':checked')) {
                $("#node-input-precision").val("");
                $("#node-input-retentionPolicy").val("");
            }
        }
    });
